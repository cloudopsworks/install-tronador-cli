name: Install Tronador CLI
description: Install the CloudOps Works Tronador CLI from GitHub Releases.
author: CloudOps Works

inputs:
  version:
    description: Release version to install (for example, 0.2.3 or v0.2.3). Defaults to the latest stable release.
    required: false
    default: latest
  install-dir:
    description: Directory where the Tronador executable is installed. Defaults to the runner tool cache.
    required: false
    default: ''
  token:
    description: >-
      Token used to resolve the latest release through the GitHub API. Authenticated requests are
      rate limited per token instead of per runner IP address, which avoids HTTP 403 rate limit
      failures on busy runners. Not used when `version` is pinned to a release tag.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The installed release tag.
  path:
    description: Absolute path to the installed Tronador executable.
  cache-hit:
    description: Whether the release was served from the runner tool cache instead of being downloaded.

runs:
  using: node24
  main: dist/index.mjs

branding:
  icon: download
  color: blue
